name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.work.sum

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3"

      - name: Install admin deps
        run: bun install --frozen-lockfile
        working-directory: frontend/admin

      - name: Build admin UI
        run: make build-admin

      - name: Sync workspace
        run: go work sync

      - name: Install CGO deps (desktop / clienthost tests)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libglfw3-dev pkg-config libxtst-dev

      - name: Install dev tools
        run: make tools-install

      - name: Lint
        env:
          CGO_ENABLED: "1"
        run: make lint

      - name: Test
        env:
          CGO_ENABLED: "1"
        run: make test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.work.sum

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3"

      - name: Install admin deps
        run: bun install --frozen-lockfile
        working-directory: frontend/admin

      - name: Build admin UI
        run: make build-admin

      - name: Sync workspace
        run: go work sync

      - name: Build binaries
        env:
          DESKTOP_VERSION: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          go build -o dist/bizshuffle-server.exe ./cmd/server
          $env:CGO_ENABLED = "1"
          go build -ldflags "-H windowsgui -X github.com/michael4d45/bizshuffle/cmd/desktop/updates.Version=$env:DESKTOP_VERSION" -o dist/bizshuffle-desktop.exe ./cmd/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/bizshuffle-server.exe
            dist/bizshuffle-desktop.exe

  build-linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache-dependency-path: go.work.sum

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3"

      - name: Install admin deps
        run: bun install --frozen-lockfile
        working-directory: frontend/admin

      - name: Build admin UI
        run: make build-admin

      - name: Sync workspace
        run: go work sync

      - name: Install CGO deps (desktop)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libglfw3-dev pkg-config libxtst-dev

      - name: Build binaries
        env:
          DESKTOP_VERSION: ${{ github.ref_name }}
          CGO_ENABLED: "1"
        run: make build-server build-desktop

      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/bizshuffle-server
            dist/bizshuffle-desktop

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-assets/bizshuffle-server.exe
            release-assets/bizshuffle-desktop.exe
            release-assets/bizshuffle-server
            release-assets/bizshuffle-desktop
